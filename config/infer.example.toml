# Protected local administrator identity. `allowed_intents` is intentionally
# omitted here: unlike an ordinary legacy Consumer, local-operator must follow
# the complete configured Intent registry so newly added operator diagnostics
# do not require a second permission-list update. Never share this credential
# with a product Consumer.
[apps.local-operator]
credential = { source = "managed" }
resource_admin = true
allowed_builtin_tools = ["web_search"]
allowed_provider_access_classes = ["standard", "subscription"]
allowed_cloud_input_modalities = ["text", "image"]
max_pending_jobs = 16
default_policy = "balanced"
allowed_policies = ["balanced", "local-first", "capability-first", "latency-first", "cost-first"]

[apps.local-operator.request_overrides]
priority = ["interactive", "normal", "background"]
placement = ["local_only", "private", "anywhere", "cloud_only"]
prefer = ["local", "trusted_node", "cloud"]
offline_required = true
capability_floor = ["foundational", "capable", "advanced", "expert", "exceptional"]
latency = ["interactive", "balanced", "throughput"]
fallback = ["none", "equivalent", "allow_lower_capability"]
max_cost_usd = { min = 0.0, max = 5.0 }

# Infra Sentinel can read only the redacted observer snapshot. HTTP auth
# rejects this credential from inference, Job, operator and resource routes.
[apps.infra-sentinel]
credential = { source = "managed" }
observer_access = "summary"
resource_admin = false
allowed_intents = []
max_pending_jobs = 1

# Ordinary Consumers receive their own least-privilege identity. This example
# is illustrative: replace its ID, Intent ACL, and request constraints rather
# than treating it as a preconfigured tenant.
[apps.example-local-consumer]
credential = { source = "managed" }
resource_admin = false
allowed_intents = ["audio.transcribe", "audio.align", "text.summarize"]
max_pending_jobs = 16
default_policy = "local-first"
allowed_policies = ["local-first"]

[apps.example-local-consumer.request_overrides]
priority = ["interactive", "background"]
placement = ["local_only"]
prefer = ["local"]
offline_required = true
capability_floor = ["foundational", "capable"]
latency = ["interactive", "balanced", "throughput"]
fallback = ["none"]
max_cost_usd = { min = 0.0, max = 0.0 }
