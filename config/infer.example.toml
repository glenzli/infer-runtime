# Portable configuration example. It demonstrates supported provider, model,
# deployment, Intent, and App contracts; it is not an inventory of any host and
# does not imply that the listed models are installed or recommended.
#
# Copy this file to config/infer.toml, then replace example paths, deployments,
# and App grants for the local machine. config/infer.toml is intentionally
# ignored. Managed credentials are generated on first use and never committed.

[server]
bind = "127.0.0.1:8787"

# Read-only facility discovery for any local consumer that implements
# infer-runtime.status. Infra Discovery carries only a relative owner-only Unix
# socket offer; the managed credential below is retained only for the explicit
# HTTP diagnostic fallback.
[observer]
enabled = true
instance_id = "local"
console_url = "http://127.0.0.1:8790/"
http_credential_id = "infra-sentinel"

[auth]
managed_credentials_directory = ".infer-runtime/credentials"

[defaults]
policy = "balanced"

# Shared, content-addressed native artifacts. Ollama and MLX retain their own
# native caches; this store is the canonical home for verified ONNX Builds and
# manifests managed by infer-runtime.
[artifacts]
root = ".infer-runtime/artifacts"

[runtimes.onnx]
library = ".infer-runtime/runtimes/onnxruntime/lib/libonnxruntime.dylib"
version = "1.27.0"
preferred_execution_providers = ["coreml", "cpu"]
allow_cpu_fallback = true

# SQLite stores only runtime metadata: config snapshots, Job/Attempt state,
# reservations, and the usage ledger. It never stores API key values or
# request/audio payloads. Relative paths resolve from the daemon's cwd.
[persistence]
path = ".infer-runtime/state/infer-runtime.sqlite3"

# Durable Responses background mode is fail-closed and disabled by default.
# When enabled, set INFER_BACKGROUND_KEY to 64 hexadecimal characters (32
# random key bytes). Plaintext payloads live only in the authenticated encrypted
# spool; SQLite stores blob references and HMAC identities. The first M4 slice
# accepts local-only text requests, never cloud placement.
[background]
enabled = false
payload_directory = ".infer-runtime/payloads"
key_env = "INFER_BACKGROUND_KEY"
max_payload_bytes = 4194304
result_retention_ms = 86400000
max_recovery_replays = 2

# Quotas are opt-in. When a global/provider/App limit is absent it is
# deliberately unlimited; configure the same four fields under one or more of
# `[quota.global]`, `[quota.providers.<id>]`, and `[quota.apps.<id>]`:
# max_usd, requests_per_minute, tokens_per_minute, max_concurrent_attempts.

[providers.ollama-local]
kind = "responses"
base_url = "http://127.0.0.1:11434/v1"
placement = "local"
max_concurrency = 1
max_queue = 32
priority_aging_ms = 10000

[providers.ollama-local.capability_profile]
version = 1
protocol = "responses"
capabilities = ["responses", "instructions", "streaming", "reasoning_effort", "temperature", "top_p", "max_output_tokens", "truncation", "metadata"]

# Native control plane for model presence only. Text execution still uses the
# shared Responses adapter above; inventory refresh never loads or unloads.
[providers.ollama-local.local_inventory]
kind = "ollama_tags"
endpoint = "http://127.0.0.1:11434"

# Host-specific classification remains configurable because unified-memory
# headroom differs materially by machine and workload. These conservative
# defaults preserve the original behavior; the measured free-memory value is
# always exposed separately from its classification.
[resources.pressure]
elevated_at_or_below_free_memory_percent = 15
critical_at_or_below_free_memory_percent = 5

# M4 pressure policy starts in recommendation-only mode. It does not invoke
# native load/unload. A resident model also needs a fresh, deployment-specific
# local benchmark under [resources.reload_benchmarks] before it can become a
# target; host measurements deliberately do not belong in this example.
[resources.eviction]
mode = "recommend"
automatic_eligible = false
minimum_resident_ms = 300000
max_benchmark_age_ms = 2592000000

# Safety resolves in this order: global -> resource class -> deployment.
# Eligibility only affects dry-run target selection today; recommendation mode
# has no native action owner and therefore cannot unload a model.
[resources.eviction.classes.light]
automatic_eligible = true
minimum_resident_ms = 300000

[resources.eviction.classes.standard]
automatic_eligible = true
minimum_resident_ms = 600000

[resources.eviction.classes.heavy]
automatic_eligible = false
minimum_resident_ms = 3600000

[resources.eviction.classes.extreme]
automatic_eligible = false
minimum_resident_ms = 7200000

# Background observation is implemented but deliberately inert until an
# operator enables it in versioned config and grants a short runtime lease.
[resources.eviction.monitor]
enabled = false
poll_interval_ms = 30000
max_lease_ms = 3600000

[resources.eviction.elevated]
target_free_memory_percent = 20

[resources.eviction.critical]
target_free_memory_percent = 25

[providers.mlx-audio-local]
kind = "audio_worker"
command = "python3"
args = ["workers/mlx_audio_worker.py"]
placement = "local"
max_concurrency = 1
max_queue = 16
priority_aging_ms = 10000

[providers.mlx-audio-local.capability_profile]
version = 1
protocol = "audio_worker"

[providers.onnx-local]
kind = "onnx"
placement = "local"
max_concurrency = 2
max_queue = 32
priority_aging_ms = 10000

[providers.onnx-local.capability_profile]
version = 1
protocol = "onnx"

[providers.onnx-local.local_inventory]
kind = "onnx_sessions"

# DeepSeek V4 Flash now implements the stateless Responses endpoint directly.
# Pro stays catalogued below but receives no deployment until the same endpoint
# is officially available for it.
[providers.deepseek-cloud]
kind = "responses"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
requires_api_key = true
placement = "cloud"
max_concurrency = 4
max_queue = 64
priority_aging_ms = 10000

[providers.deepseek-cloud.capability_profile]
version = 1
protocol = "responses"
capabilities = ["responses", "instructions", "streaming", "function_tools", "reasoning_effort", "temperature", "top_p", "max_output_tokens", "truncation", "metadata"]

# One local Codex App Server process exposes a subscription-backed group of
# cloud models. Local stdio is only the transport: placement remains cloud and
# existing Consumers are denied unless their App explicitly opts into the
# subscription access class. The adapter admits only the three Builds below;
# other models returned by model/list remain operator-visible inventory.
[providers.codex-subscription]
kind = "codex_app_server"
access_class = "subscription"
# Replace with an absolute executable path when a GUI-owned Console does not
# inherit the shell PATH.
command = "codex"
args = [
  "app-server",
  "--strict-config",
  "--disable", "shell_tool",
  "--disable", "unified_exec",
  "--disable", "plugins",
  "--disable", "apps",
  "--disable", "multi_agent",
  "--disable", "computer_use",
  "-c", "agents.enabled=false",
  "-c", "web_search=\"disabled\"",
  "-c", "history.persistence=\"none\"",
  "-c", "memories.generate_memories=false",
  "-c", "feedback.enabled=false",
  "--listen", "stdio://",
]
placement = "cloud"
max_concurrency = 1
max_queue = 16
priority_aging_ms = 10000

[providers.codex-subscription.capability_profile]
version = 1
protocol = "codex_app_server"
capabilities = ["responses", "instructions", "streaming", "web_search", "image_generation", "reasoning_effort"]

[profiles.balanced]
order = ["capability_fit", "deadline_fit", "queue_time", "cost", "placement"]

[profiles.local-first]
order = ["placement", "deadline_fit", "queue_time", "cost", "capability_fit"]

[profiles.capability-first]
order = ["capability", "deadline_fit", "cost", "placement"]

[profiles.latency-first]
order = ["deadline_fit", "queue_time", "placement", "capability_fit", "cost"]

[profiles.cost-first]
order = ["cost", "placement", "capability_fit"]

# Intent profiles are stable runtime contracts. Application names never appear
# here; an App maps its own actions to one of these intents.
[intents."text.summarize"]
input_modalities = ["text"]
output_modalities = ["text"]
default_capability_floor = "foundational"
default_policy = "cost-first"
default_max_output_tokens = 256
default_reasoning_effort = "none"

[intents."text.proofread"]
input_modalities = ["text"]
output_modalities = ["text"]
default_capability_floor = "foundational"
default_policy = "cost-first"
default_max_output_tokens = 512
default_reasoning_effort = "none"

[intents."language.respond"]
input_modalities = ["text"]
output_modalities = ["text"]
default_capability_floor = "capable"
default_policy = "balanced"

# Stateless image+text reasoning. Cloud image egress also requires the App's
# independent allowed_cloud_input_modalities entitlement.
[intents."multimodal.respond"]
input_modalities = ["text", "image"]
output_modalities = ["text"]
default_capability_floor = "capable"
default_policy = "balanced"

# First-slice hosted generation is a distinct unary text-to-image contract.
# The request must contain exactly tools=[{type="image_generation"}].
[intents."image.generate"]
input_modalities = ["text"]
output_modalities = ["image"]
required_features = ["image_generation"]
default_capability_floor = "capable"
default_policy = "balanced"

[intents."reasoning.solve"]
input_modalities = ["text"]
output_modalities = ["text"]
default_capability_floor = "advanced"
default_policy = "capability-first"

# Bounded generative vision remains a typed local data plane. The Consumer
# supplies a normalized display artifact and never sees Ollama's chat schema.
[intents."vision.describe_image"]
data_plane = "vision.image_description"
input_modalities = ["image"]
output_modalities = ["json"]
required_features = ["structured_vision_output"]
default_capability_floor = "foundational"
default_policy = "local-first"

[intents."vision.classify_closed_set"]
data_plane = "vision.classification_review"
input_modalities = ["image"]
output_modalities = ["json"]
required_features = ["structured_vision_output"]
default_capability_floor = "capable"
default_policy = "local-first"

[intents."vision.detect_faces"]
data_plane = "vision.face_detection"
input_modalities = ["image"]
output_modalities = ["json"]
required_features = ["five_point_landmarks"]
default_capability_floor = "foundational"
default_policy = "local-first"

[intents."vision.embed_face"]
data_plane = "vision.face_embedding"
input_modalities = ["image"]
output_modalities = ["json"]
required_features = ["face_embedding_128d", "sensitive_biometric"]
default_capability_floor = "foundational"
default_policy = "local-first"

[intents."semantic.embed_image"]
data_plane = "vision.image_embedding"
input_modalities = ["image"]
output_modalities = ["json"]
required_features = ["siglip2_embedding_768d", "cross_modal_retrieval"]
default_capability_floor = "foundational"
default_policy = "local-first"

[intents."semantic.embed_text"]
data_plane = "vision.text_embedding"
input_modalities = ["text"]
output_modalities = ["json"]
required_features = ["siglip2_embedding_768d", "multilingual_text", "cross_modal_retrieval"]
default_capability_floor = "foundational"
default_policy = "local-first"

[intents."audio.transcribe"]
data_plane = "audio.transcription"
input_modalities = ["audio"]
output_modalities = ["text", "json"]
required_features = ["language_detection"]
default_capability_floor = "foundational"
default_policy = "local-first"

[intents."audio.align"]
data_plane = "audio.alignment"
input_modalities = ["audio", "text"]
output_modalities = ["json"]
required_features = ["word_timestamps"]
default_capability_floor = "foundational"
default_policy = "local-first"

[intents."speech.synthesize"]
data_plane = "audio.speech"
input_modalities = ["text"]
output_modalities = ["audio"]
required_features = ["built_in_voices"]
default_capability_floor = "foundational"
default_policy = "local-first"

[intents."speech.design_voice"]
data_plane = "audio.speech"
input_modalities = ["text"]
output_modalities = ["audio"]
required_features = ["voice_design"]
default_capability_floor = "foundational"
default_policy = "local-first"

[intents."speech.clone_voice"]
data_plane = "audio.voice_clone"
input_modalities = ["text", "audio"]
output_modalities = ["audio"]
required_features = ["voice_clone"]
default_capability_floor = "foundational"
default_policy = "local-first"

